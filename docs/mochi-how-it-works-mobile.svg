<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1790" viewBox="0 0 720 1790" role="img" aria-label="How Mochi works on a phone: choose media or speech result, captions first and AI only when necessary">
<title>How Mochi works on a phone: choose media or speech result, captions first and AI only when necessary</title>
<desc>Choose video or audio for a direct yt-dlp download, or subtitles or transcript for existing YouTube captions first and local faster-whisper AI only as a fallback. Results save locally.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac8bfa"/></marker></defs>
<rect x="0" y="0" width="720" height="1790" rx="26" fill="#0f131e"/>
<rect x="38" y="30" width="644" height="112" rx="24" fill="#1c2535" stroke="#6c549e" stroke-width="2"/>
<text x="360" y="75" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#f4f2ff" text-anchor="middle">✦  MOCHI</text>
<text x="360" y="116" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#abb5ca" text-anchor="middle">Run Mochi Now  ·  Local browser studio</text>
<path d="M 360 143 V 178" fill="none" stroke="#825be7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="38" y="181" width="644" height="104" rx="21" fill="#1c2535" stroke="#6c549e" stroke-width="2"/>
<text x="360" y="224" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#f4f2ff" text-anchor="middle">🔗  Paste one YouTube link</text>
<text x="360" y="260" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#abb5ca" text-anchor="middle">🎯  Choose ONE output</text>
<path d="M 360 286 V 329" fill="none" stroke="#825be7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="38" y="333" width="644" height="442" rx="24" fill="#171e2b" stroke="#344057" stroke-width="1.2"/>
<text x="68" y="374" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#b89bff" text-anchor="start">MEDIA  ·  DIRECT DOWNLOAD</text>
<rect x="65" y="402" width="590" height="157" rx="17" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="92" y="442" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f2ff" text-anchor="start">🎬  Full video</text>
<text x="92" y="479" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp downloads · FFmpeg joins if needed</text>
<rect x="87" y="499" width="546" height="43" rx="10" fill="#19352f" stroke="#376b59" stroke-width="1.2"/>
<text x="107" y="527" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#7de2b5" text-anchor="start">💾  Video file</text>
<rect x="65" y="578" width="590" height="157" rx="17" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="92" y="618" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f2ff" text-anchor="start">🎧  Audio only</text>
<text x="92" y="655" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp downloads · FFmpeg converts MP3</text>
<rect x="87" y="675" width="546" height="43" rx="10" fill="#19352f" stroke="#376b59" stroke-width="1.2"/>
<text x="107" y="703" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#7de2b5" text-anchor="start">💾  Original audio or MP3</text>
<path d="M 79 803 H 320" fill="none" stroke="#344057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 400 803 H 640" fill="none" stroke="#344057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="360" y="809" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#b89bff" text-anchor="middle">OR</text>
<rect x="38" y="819" width="644" height="751" rx="24" fill="#171e2b" stroke="#344057" stroke-width="1.2"/>
<text x="68" y="862" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#b89bff" text-anchor="start">SPEECH  ·  SUBTITLES OR TRANSCRIPT</text>
<rect x="64" y="886" width="592" height="123" rx="17" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="93" y="930" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ff" text-anchor="start">⚡  1 · Existing YouTube captions</text>
<text x="93" y="972" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp checks caption tracks</text>
<text x="360" y="1040" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#949dbc" text-anchor="middle">If missing / unusable  ↓</text>
<rect x="64" y="1062" width="592" height="123" rx="17" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="93" y="1106" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ff" text-anchor="start">🔄  2 · Second caption reader</text>
<text x="93" y="1148" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#abb5ca" text-anchor="start">youtube-transcript-api tries again</text>
<text x="360" y="1216" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#949dbc" text-anchor="middle">If both fail  ↓</text>
<rect x="64" y="1240" width="592" height="164" rx="17" fill="#1c2535" stroke="#64549a" stroke-width="1.5"/>
<text x="93" y="1284" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#f4f2ff" text-anchor="start">🧠  3 · Local AI fallback</text>
<text x="93" y="1325" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp downloads original audio</text>
<text x="93" y="1364" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#abb5ca" text-anchor="start">faster-whisper listens locally</text>
<rect x="64" y="1427" width="592" height="113" rx="16" fill="#19352f" stroke="#376b59" stroke-width="1.2"/>
<text x="92" y="1468" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#7de2b5" text-anchor="start">💾  First working method saves:</text>
<text x="92" y="1510" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f2ff" text-anchor="start">Subtitles.srt + .vtt  OR  Transcript.txt</text>
<rect x="38" y="1593" width="644" height="108" rx="21" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="66" y="1636" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ff" text-anchor="start">📝  Transcript ready?</text>
<text x="66" y="1674" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#abb5ca" text-anchor="start">📖 Open  ·  📋 Copy for AI  ·  📁 Folder</text>
<text x="360" y="1739" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#b89bff" text-anchor="middle">📁 Saved in .mochi/Downloads/</text>
<text x="360" y="1770" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#abb5ca" text-anchor="middle">Captions skip AI · No automatic transcript upload</text>
</svg>
