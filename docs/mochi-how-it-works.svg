<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-label="How Mochi works: one link, direct media downloads or captions first and local AI as a fallback">
<title>How Mochi works: one link, direct media downloads or captions first and local AI as a fallback</title>
<desc>Choose video or audio for a direct yt-dlp download, or subtitles or transcript for existing YouTube captions first and local faster-whisper AI only as a fallback. Results save locally.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ac8bfa"/></marker></defs>
<rect x="0" y="0" width="1280" height="1000" rx="26" fill="#0f131e"/>
<rect x="396" y="40" width="488" height="106" rx="24" fill="#1c2535" stroke="#6c549e" stroke-width="2"/>
<text x="640" y="86" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="37" font-weight="700" fill="#f4f2ff" text-anchor="middle">✦  MOCHI</text>
<text x="640" y="120" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#abb5ca" text-anchor="middle">Run Mochi Now  ·  Local browser studio</text>
<path d="M 640 147 V 176" fill="none" stroke="#825be7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="396" y="181" width="488" height="90" rx="22" fill="#1c2535" stroke="#6c549e" stroke-width="2"/>
<text x="640" y="217" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ff" text-anchor="middle">🔗  Paste one YouTube link</text>
<text x="640" y="249" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#abb5ca" text-anchor="middle">🎯  Choose ONE output</text>
<path d="M 640 272 V 299 H 327 V 330" fill="none" stroke="#825be7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 640 299 H 953 V 330" fill="none" stroke="#825be7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="47" y="338" width="558" height="566" rx="25" fill="#171e2b" stroke="#344057" stroke-width="1.2"/>
<rect x="675" y="338" width="558" height="566" rx="25" fill="#171e2b" stroke="#344057" stroke-width="1.2"/>
<text x="80" y="379" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#b89bff" text-anchor="start">MEDIA  ·  DIRECT DOWNLOAD</text>
<text x="707" y="379" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#b89bff" text-anchor="start">SPEECH  ·  SMART FALLBACK</text>
<rect x="78" y="402" width="496" height="178" rx="18" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="105" y="447" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ff" text-anchor="start">🎬  Full video</text>
<text x="105" y="484" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp downloads the video</text>
<text x="105" y="513" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#abb5ca" text-anchor="start">FFmpeg joins video + audio if needed</text>
<rect x="98" y="533" width="456" height="32" rx="9" fill="#19352f" stroke="#376b59" stroke-width="1.2"/>
<text x="117" y="555" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#7de2b5" text-anchor="start">💾  Video file saved</text>
<rect x="78" y="601" width="496" height="178" rx="18" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="105" y="646" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f2ff" text-anchor="start">🎧  Audio only</text>
<text x="105" y="683" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp downloads the sound</text>
<text x="105" y="712" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#abb5ca" text-anchor="start">FFmpeg converts if you choose MP3</text>
<rect x="98" y="732" width="456" height="32" rx="9" fill="#19352f" stroke="#376b59" stroke-width="1.2"/>
<text x="117" y="754" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#7de2b5" text-anchor="start">💾  Original audio or MP3 saved</text>
<rect x="95" y="816" width="465" height="33" rx="10" fill="#242a3d" stroke="#242a3d" stroke-width="0"/>
<text x="108" y="838" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#cfbfff" text-anchor="start">📁  Your files stay in .mochi/Downloads/</text>
<rect x="706" y="404" width="496" height="93" rx="18" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="733" y="445" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="start">⚡  1 · Existing YouTube captions</text>
<text x="733" y="475" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp checks the available tracks</text>
<text x="954" y="527" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#949dbc" text-anchor="middle">If missing / unusable  ↓</text>
<rect x="706" y="542" width="496" height="93" rx="18" fill="#1c2535" stroke="#344057" stroke-width="1.2"/>
<text x="733" y="583" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="start">🔄  2 · Second direct caption reader</text>
<text x="733" y="613" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#abb5ca" text-anchor="start">youtube-transcript-api tries another way</text>
<text x="954" y="664" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#949dbc" text-anchor="middle">If still unavailable  ↓</text>
<rect x="706" y="679" width="496" height="107" rx="18" fill="#1c2535" stroke="#64549a" stroke-width="1.5"/>
<text x="733" y="718" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2ff" text-anchor="start">🧠  3 · Local AI, only if needed</text>
<text x="733" y="749" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#abb5ca" text-anchor="start">yt-dlp gets audio  ·  faster-whisper listens</text>
<text x="733" y="774" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#abb5ca" text-anchor="start">AI runs on your computer</text>
<rect x="706" y="808" width="496" height="76" rx="18" fill="#19352f" stroke="#376b59" stroke-width="1.2"/>
<text x="733" y="843" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#7de2b5" text-anchor="start">💾  First working method saves:</text>
<text x="733" y="867" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#f4f2ff" text-anchor="start">Subtitles.srt + .vtt  OR  Transcript.txt</text>
<path d="M 77 927 H 1203" fill="none" stroke="#344057" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
<text x="640" y="958" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f2ff" text-anchor="middle">📝  Transcript:  Open  ·  Copy for AI  ·  Open folder</text>
<text x="640" y="983" font-family="Inter, Segoe UI, Noto Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#abb5ca" text-anchor="middle">Captions skip audio + AI when usable. No automatic transcript upload to AI chats.</text>
</svg>
