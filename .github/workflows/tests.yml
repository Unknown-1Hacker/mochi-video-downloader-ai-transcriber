name: 🧪 Mochi checks
on:
  push:
  pull_request:

permissions:
  contents: read

# Keep only the newest test attempt per branch; never queue obsolete edits.
concurrency:
  group: mochi-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Media tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Media tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install test dependencies
        run: python -m pip install -r app/requirements.txt -r app/requirements-ai.txt pytest numpy pillow
      - name: Test Mochi
        run: python -m pytest -q
      - name: Check universal dependency resolution
        if: runner.os == 'Linux'
        run: |
          python -m pip install uv
          uv pip compile --universal --python-version 3.12 app/requirements.txt -o /tmp/requirements.lock
          uv pip compile --universal --python-version 3.12 app/requirements-ai.txt -o /tmp/requirements-ai.lock
      - name: Test actual browser controls (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python .github/scripts/render_docs_previews.py
      - name: Compile source
        run: python -m compileall -q app
      - name: Check readable release notes
        run: python .github/scripts/release_notes.py check
