name: 🧪 Mochi checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Media tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Media tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install test dependencies
        run: python -m pip install -r app/requirements.txt pytest numpy pillow
      - name: Test Mochi
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q app
