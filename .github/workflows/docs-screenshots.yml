name: 🖼️ Refresh README screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - docs/sync-current-ui-previews-20261103
    paths:
      - .github/scripts/render_docs_previews.py
      - .github/workflows/docs-screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot dependencies
        run: |
          python -m pip install -r app/requirements.txt playwright pillow
          python -m playwright install chromium
      - name: Capture actual Home and transcript interfaces
        run: python .github/scripts/render_docs_previews.py
      - name: Validate screenshot artifacts
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ("mochi-interface.webp", "mochi-transcript-result.webp",
                       "mochi-first-time-vs-next-time.webp"):
              p = Path("docs") / name
              with Image.open(p) as im:
                  assert im.format == "WEBP", name
                  assert im.width >= 800 and im.height >= 180, (name, im.size)
                  im.verify()
              assert p.stat().st_size < 500_000, name
          print("Both UI captures and the hand-designed setup guide are valid WebP files.")
          PY
      # Keep the hand-designed mascot setup guide intact. Only UI screenshots refresh.
      - name: Save updated UI screenshots to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/mochi-interface.webp docs/mochi-transcript-result.webp
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh UI and setup previews from current Mochi'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
