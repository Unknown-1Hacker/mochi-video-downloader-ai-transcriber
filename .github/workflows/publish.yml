name: 🐰 Publish Mochi

# A new release must be deliberately dispatched; editing notes is not a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v0.2.0)
        required: true
        default: v0.3.7
        type: string

permissions:
  contents: write

concurrency:
  group: mochi-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 🧭 Confirm public release version matches bundled app
        env:
          VERSION: ${{ inputs.version || 'v0.3.7' }}
        run: |
          python - <<'PY'
          import os
          from app.version import RELEASE_VERSION
          expected = 'v' + RELEASE_VERSION
          assert os.environ['VERSION'] == expected, (
              f"Refusing mismatched tag: expected {expected}"
          )
          PY
      - name: 📝 Require real notes for the new version
        env:
          VERSION: ${{ inputs.version || 'v0.3.7' }}
        run: python .github/scripts/release_notes.py render "$VERSION" >/dev/null
      - name: 🧪 Check Mochi before release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r app/requirements.txt -r app/requirements-ai.txt pytest numpy pillow
          python -m pytest -q
      - name: 🔒 Resolve one portable dependency set
        run: |
          python -m pip install uv
          uv pip compile --universal --python-version 3.12 app/requirements.txt -o app/requirements.lock
          uv pip compile --universal --python-version 3.12 app/requirements-ai.txt -o app/requirements-ai.lock
      - name: 📦 Build one clean Mochi.zip
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED

          launchers = [
              Path('Install-Mochi-Windows.cmd'),
              Path('Install-Mochi-Mac.command'),
              Path('Install-Mochi-Linux.sh'),
              Path('📖 READ ME.txt'),
          ]
          source = [p for p in Path('app').rglob('*') if p.is_file()
                    and 'tests' not in p.parts and '__pycache__' not in p.parts
                    and p.suffix not in ('.pyc', '.pyo')]
          files = launchers + sorted(source)
          assert all(p.exists() for p in files)
          assert len(files) >= 15, 'Missing application files'
          Path('dist').mkdir(exist_ok=True)
          with ZipFile('dist/Mochi.zip', 'w', compression=ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  name = 'Mochi/' + path.as_posix()
                  info = ZipInfo(name, date_time=(2026, 10, 30, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.create_system = 3
                  executable = path.suffix in ('.sh', '.command')
                  info.external_attr = ((0o100755 if executable else 0o100644) << 16)
                  z.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          with ZipFile('dist/Mochi.zip') as z:
              assert z.testzip() is None
              members = set(z.namelist())
              assert {'Mochi/app/studio.py', 'Mochi/app/version.py', 'Mochi/app/guardian.py',
                  'Mochi/app/requirements.lock', 'Mochi/app/requirements-ai.lock',
                  'Mochi/app/captions.py',
                  'Mochi/app/assets/hero-bunny.png',
                      'Mochi/Install-Mochi-Windows.cmd',
                      'Mochi/Install-Mochi-Mac.command',
                      'Mochi/Install-Mochi-Linux.sh'} <= members
              assert not any('/tests/' in n or '/__pycache__/' in n for n in members)
          print(f'✅ One clean package: {len(files)} files')
          PY
      - name: 🔍 Smoke test the actual release ZIP
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile('dist/Mochi.zip') as z:
              names = set(z.namelist())
              required = {'Mochi/Install-Mochi-Linux.sh',
                          'Mochi/Install-Mochi-Mac.command',
                          'Mochi/Install-Mochi-Windows.cmd',
                          'Mochi/app/assets/hero-bunny.png'}
              assert required <= names
              assert not any('1 INSTALL & OPEN' in name for name in names)
              for path in ('Mochi/Install-Mochi-Linux.sh', 'Mochi/Install-Mochi-Mac.command'):
                  assert (z.getinfo(path).external_attr >> 16) & 0o111, path

              with tempfile.TemporaryDirectory(prefix='Mochi smoke & spaces ') as tmp:
                  z.extractall(tmp)
                  root = Path(tmp) / 'Mochi'
                  marker = Path(tmp) / 'started'
                  # No network: verify the archived launcher finds its sibling
                  # bootstrap even when the extracted folder contains spaces/&.
                  (root / 'app' / 'bootstrap.sh').write_text(
                      '#!/bin/sh\nprintf ready > "$MOCHI_SMOKE_MARKER"\n',
                      encoding='utf-8')
                  env = os.environ.copy()
                  env['MOCHI_SMOKE_MARKER'] = str(marker)
                  subprocess.run(
                      ['/bin/sh', str(root / 'Install-Mochi-Linux.sh')],
                      env=env, check=True, timeout=15)
                  assert marker.read_text(encoding='utf-8') == 'ready'
          PY
      - name: 💜 Write short notes for this exact version
        env:
          VERSION: ${{ inputs.version || 'v0.3.7' }}
        run: |
          python .github/scripts/release_notes.py check
          python .github/scripts/release_notes.py render "$VERSION" > dist/RELEASE.md
      - name: 🚀 Publish one download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version || 'v0.3.7' }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a version such as v0.1.0'
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION" \
            dist/Mochi.zip \
            --title "🐰 Mochi · $VERSION" \
            --notes-file dist/RELEASE.md \
            --target "$GITHUB_SHA" \
            --latest