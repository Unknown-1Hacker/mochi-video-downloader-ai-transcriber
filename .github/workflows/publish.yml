name: 🐰 Publish Mochi

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v0.2.0)
        required: true
        default: v0.2.1
        type: string

permissions:
  contents: write

concurrency:
  group: mochi-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 🧪 Check Mochi before release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r app/requirements.txt pytest numpy pillow
          python -m pytest -q
      - name: 🔒 Resolve one portable dependency set
        run: |
          python -m pip install uv
          uv pip compile --universal --python-version 3.12 app/requirements.txt -o app/requirements.lock
      - name: 📦 Build one clean Mochi.zip
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED

          launchers = [
              Path('Install-Mochi-Windows.cmd'),
              Path('Install-Mochi-Mac.command'),
              Path('Install-Mochi-Linux.sh'),
              Path('📖 READ ME.txt'),
          ]
          source = [p for p in Path('app').rglob('*') if p.is_file()
                    and 'tests' not in p.parts and '__pycache__' not in p.parts
                    and p.suffix not in ('.pyc', '.pyo')]
          files = launchers + sorted(source)
          assert all(p.exists() for p in files)
          assert len(files) >= 15, 'Missing application files'
          Path('dist').mkdir(exist_ok=True)
          with ZipFile('dist/Mochi.zip', 'w', compression=ZIP_DEFLATED, compresslevel=9) as z:
              for path in files:
                  name = 'Mochi/' + path.as_posix()
                  info = ZipInfo(name, date_time=(2026, 10, 30, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.create_system = 3
                  executable = path.suffix in ('.sh', '.command')
                  info.external_attr = ((0o100755 if executable else 0o100644) << 16)
                  z.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          with ZipFile('dist/Mochi.zip') as z:
              assert z.testzip() is None
              members = set(z.namelist())
              assert {'Mochi/app/studio.py', 'Mochi/app/version.py', 'Mochi/app/guardian.py',
                  'Mochi/app/requirements.lock', 'Mochi/app/assets/hero-bunny.png',
                      'Mochi/Install-Mochi-Windows.cmd',
                      'Mochi/Install-Mochi-Mac.command',
                      'Mochi/Install-Mochi-Linux.sh'} <= members
              assert not any('/tests/' in n or '/__pycache__/' in n for n in members)
          print(f'✅ One clean package: {len(files)} files')
          PY
      - name: 💜 Write simple release notes
        run: |
          cat > dist/RELEASE.md <<'MD'
          ## 🐰 Meet Mochi!
          **One YouTube link → your video, audio, subtitles, or transcript.**

          🎬 **Video** · 🎧 **Audio** · 💬 **AI subtitles** · 📝 **Speech to text**

          ### ✨ Get started
          1. Download **Mochi.zip** below (not Source code).
          2. Extract it, then open **Install-Mochi-Windows.cmd / Mac.command / Linux.sh** for your OS.
          3. Paste a link → pick what you want → **Make it happen!**

          🔒 Speech recognition runs on your computer. Internet is needed for setup, AI models, and video downloads.

          🛠 **Something stuck?** Tap **Fix my tools**. Your OS may still ask you to approve the launcher.

          💜 Made with love by **[1Hack](https://onehack.st/)**
          MD
      - name: 🚀 Publish one download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version || 'v0.2.1' }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a version such as v0.1.0'
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION" \
            dist/Mochi.zip \
            --title "🐰 Mochi · $VERSION" \
            --notes-file dist/RELEASE.md \
            --target "$GITHUB_SHA" \
            --latest